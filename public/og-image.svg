<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">PyStudio: a collaborative Python IDE</title>
  <desc id="description">Syntax-colored Python code with two collaborators editing together in a dark code editor.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#283241" stroke-opacity=".22" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#080b12"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <rect x="54" y="42" width="42" height="42" rx="10" fill="#f59e0b"/>
  <text x="75" y="70" text-anchor="middle" fill="#10131b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">&gt;_</text>
  <text x="111" y="62" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">PyStudio</text>
  <text x="112" y="82" fill="#8b97a8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1">REAL-TIME PYTHON IDE</text>
  <rect x="912" y="48" width="234" height="34" rx="17" fill="#101720" stroke="#263142"/>
  <circle cx="932" cy="65" r="5" fill="#34d399"/>
  <text x="946" y="69" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">2 collaborators editing</text>

  <rect x="54" y="120" width="772" height="456" rx="13" fill="#0e121b" stroke="#283241" stroke-width="1.5"/>
  <path d="M67 120h746a13 13 0 0 1 13 13v34H54v-34a13 13 0 0 1 13-13Z" fill="#151b26"/>
  <circle cx="78" cy="143" r="5" fill="#fb7185"/>
  <circle cx="96" cy="143" r="5" fill="#fbbf24"/>
  <circle cx="114" cy="143" r="5" fill="#34d399"/>
  <text x="145" y="147" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">main.py</text>
  <text x="760" y="147" text-anchor="end" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Python 3.11</text>
  <path d="M54 167h772" stroke="#283241"/>
  <path d="M96 167v409" stroke="#202938"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" xml:space="preserve">
    <g fill="#526071" text-anchor="end" font-size="13">
      <text x="84" y="205">1</text><text x="84" y="249">2</text><text x="84" y="293">3</text>
      <text x="84" y="337">4</text><text x="84" y="381">5</text><text x="84" y="425">6</text>
      <text x="84" y="469">7</text><text x="84" y="513">8</text>
    </g>
    <text x="112" y="205"><tspan fill="#f472b6">def</tspan><tspan fill="#60a5fa"> summarize</tspan><tspan fill="#e2e8f0">(rows):</tspan></text>
    <text x="112" y="249"><tspan fill="#e2e8f0">    active = [row </tspan><tspan fill="#f472b6">for</tspan><tspan fill="#e2e8f0"> row </tspan><tspan fill="#f472b6">in</tspan><tspan fill="#e2e8f0"> rows </tspan><tspan fill="#f472b6">if</tspan><tspan fill="#e2e8f0"> row[</tspan><tspan fill="#a3e635">&quot;ready&quot;</tspan><tspan fill="#e2e8f0">]]</tspan></text>
    <text x="112" y="293"><tspan fill="#e2e8f0">    total = </tspan><tspan fill="#38bdf8">sum</tspan><tspan fill="#e2e8f0">(row[</tspan><tspan fill="#a3e635">&quot;score&quot;</tspan><tspan fill="#e2e8f0">] </tspan><tspan fill="#f472b6">for</tspan><tspan fill="#e2e8f0"> row </tspan><tspan fill="#f472b6">in</tspan><tspan fill="#e2e8f0"> active)</tspan></text>
    <text x="112" y="337"><tspan fill="#e2e8f0">    </tspan><tspan fill="#f472b6">return</tspan><tspan fill="#e2e8f0"> {</tspan><tspan fill="#a3e635">&quot;count&quot;</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#38bdf8">len</tspan><tspan fill="#e2e8f0">(active), </tspan><tspan fill="#a3e635">&quot;total&quot;</tspan><tspan fill="#e2e8f0">: total}</tspan></text>
    <text x="112" y="381"><tspan fill="#e2e8f0">    </tspan><tspan fill="#f472b6">return</tspan><tspan fill="#e2e8f0"> total / </tspan><tspan fill="#38bdf8">max</tspan><tspan fill="#e2e8f0">(</tspan><tspan fill="#38bdf8">len</tspan><tspan fill="#e2e8f0">(active), </tspan><tspan fill="#fb923c">1</tspan><tspan fill="#e2e8f0">)</tspan></text>
    <text x="112" y="425"><tspan fill="#f472b6">for</tspan><tspan fill="#e2e8f0"> row </tspan><tspan fill="#f472b6">in</tspan><tspan fill="#e2e8f0"> rows:</tspan></text>
    <text x="112" y="469"><tspan fill="#e2e8f0">    </tspan><tspan fill="#38bdf8">print</tspan><tspan fill="#e2e8f0">(</tspan><tspan fill="#38bdf8">summarize</tspan><tspan fill="#e2e8f0">(row))</tspan></text>
    <text x="112" y="513"><tspan fill="#64748b"># both cursors stay in sync</tspan></text>
  </g>

  <rect x="484" y="229" width="2" height="24" rx="1" fill="#34d399"/>
  <rect x="486" y="208" width="48" height="19" rx="5" fill="#059669"/>
  <text x="510" y="222" text-anchor="middle" fill="#f0fdf4" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600">Mira</text>
  <rect x="354" y="317" width="2" height="24" rx="1" fill="#f59e0b"/>
  <rect x="356" y="296" width="42" height="19" rx="5" fill="#d97706"/>
  <text x="377" y="310" text-anchor="middle" fill="#fffbeb" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600">Sam</text>

  <rect x="850" y="120" width="296" height="456" rx="13" fill="#0e121b" stroke="#283241" stroke-width="1.5"/>
  <text x="876" y="157" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1">IN THIS ROOM</text>
  <circle cx="887" cy="197" r="15" fill="#0f766e"/>
  <text x="887" y="201" text-anchor="middle" fill="#ccfbf1" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">M</text>
  <text x="914" y="194" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Mira Chen</text>
  <text x="914" y="211" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">typing now</text>
  <circle cx="887" cy="242" r="15" fill="#92400e"/>
  <text x="887" y="246" text-anchor="middle" fill="#fef3c7" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">S</text>
  <text x="914" y="239" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Sam Rivera</text>
  <text x="914" y="256" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">typing now</text>
  <path d="M870 278h256" stroke="#283241"/>
  <text x="876" y="309" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1">SHARED TERMINAL</text>
  <rect x="870" y="327" width="256" height="132" rx="8" fill="#080b12" stroke="#202938"/>
  <circle cx="888" cy="348" r="4" fill="#34d399"/>
  <text x="901" y="352" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">python main.py</text>
  <text x="886" y="383" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">&gt;&gt;&gt; summarize(rows)</text>
  <text x="886" y="410" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">{'count': 3, 'total': 24}</text>
  <text x="886" y="437" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Ready for input_</text>
  <rect x="870" y="483" width="256" height="48" rx="8" fill="#111a18" stroke="#1f4739"/>
  <circle cx="890" cy="507" r="5" fill="#34d399"/>
  <text x="906" y="511" fill="#a7f3d0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">LIVE COLLABORATION</text>

  <text x="56" y="610" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1">WRITE TOGETHER. RUN ANYWHERE.</text>
</svg>
